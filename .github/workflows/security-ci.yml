name: Security & Code Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep & GDToolkit
        run: |
          python -m pip install semgrep gdtoolkit

      - name: Run Semgrep (Security Scan)
        run: >-
          semgrep scan
          --error
          --config p/security-audit
          --config p/ci
          --exclude addons/godot-sqlite
          --exclude addons/lua-gdextension

      - name: Run GDScript Linter
        run: gdlint scripts/
