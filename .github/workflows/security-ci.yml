name: Security & Code Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Code inkl. kompletter Historie aus dem Repository holen
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Secret-Scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # 3. Python für Semgrep und GDScript-Tools aufsetzen
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Semgrep und GDScript-Linter installieren
      - name: Install Semgrep & GDToolkit
        run: |
          python -m pip install semgrep gdtoolkit

      # 5. Semgrep Security Scan (Add-ons ausgeschlossen)
      - name: Run Semgrep (Security Scan)
        run: >-
          semgrep scan
          --error
          --config p/security-audit
          --config p/ci
          --exclude addons/godot-sqlite
          --exclude addons/lua-gdextension

      # 6. GDScript Linter
      - name: Run GDScript Linter
        run: gdlint scripts/
