name: Security & Code Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Code aus dem Repository holen
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Secret-Scanning (Sucht nach API-Keys/Passwörtern)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Python für Semgrep und GDScript-Tools aufsetzen
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Semgrep und GDScript-Linter installieren
      - name: Install Semgrep & GDToolkit
        run: |
          python -m pip install semgrep gdtoolkit

      # 5. Add-ons enthalten Drittanbieter-Code und werden nicht mitgescannt
      - name: Run Semgrep (Security Scan)
        run: >-
          semgrep scan
          --error
          --config p/security-audit
          --config p/ci
          --exclude addons/godot-sqlite
          --exclude addons/lua-gdextension

      - name: Run GDScript Linter
        run: gdlint scripts/
