name: Security & Code Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Semgrep & GDToolkit
        run: |
          python -m pip install semgrep "gdtoolkit==4.5.0"

      - name: Run Semgrep (Security Scan)
        run: >-
          semgrep scan
          --error
          --config p/security-audit
          --config p/ci
          --exclude addons/godot-sqlite
          --exclude addons/lua-gdextension

      - name: Run GDScript Linter
        run: gdlint scripts/
